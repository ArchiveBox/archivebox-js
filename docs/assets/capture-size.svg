<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="380" viewBox="0 0 1360 380" role="img" aria-labelledby="title desc"><title id="title">Default capture size on disk</title><desc id="desc">On sweeting.me, native ArchiveBox uses 41.5 MB and ArchiveBox JS uses 36.9 MB. On docs.sweeting.me/s/blog, native ArchiveBox uses 320.3 MB and ArchiveBox JS uses 57.2 MB. Two runs per engine; smaller is better.</desc><rect width="1360" height="380" rx="22" fill="#f7f4f6"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="40" y="42" font-size="22" font-weight="700" fill="#29222c">Final capture size on disk</text><text x="40" y="70" font-size="14" fill="#776d77">Default plugins · two fresh runs per engine · MB (decimal) · October 4, 2026</text><text x="40" y="118" fill="#29222c" font-size="18" font-weight="600">sweeting.me</text><text x="40" y="156" fill="#514750" font-size="14">ArchiveBox snapshot</text><rect x="40" y="168" width="470.00" height="28" rx="5" fill="#8c7d87"/><text x="522.00" y="188" fill="#29222c" font-size="17" font-weight="600">41.5 MB</text><text x="40" y="232" fill="#514750" font-size="14">ArchiveBox JS / WACZ</text><rect x="40" y="244" width="418.04" height="28" rx="5" fill="#aa245b"/><text x="470.04" y="264" fill="#29222c" font-size="17" font-weight="600">36.9 MB</text><text x="40" y="322" fill="#aa245b" font-size="17" font-weight="600">11% less disk space</text><text x="710" y="118" fill="#29222c" font-size="18" font-weight="600">docs.sweeting.me/s/blog</text><text x="710" y="156" fill="#514750" font-size="14">ArchiveBox snapshot</text><rect x="710" y="168" width="470.00" height="28" rx="5" fill="#8c7d87"/><text x="1192.00" y="188" fill="#29222c" font-size="17" font-weight="600">320.3 MB</text><text x="710" y="232" fill="#514750" font-size="14">ArchiveBox JS / WACZ</text><rect x="710" y="244" width="84.00" height="28" rx="5" fill="#aa245b"/><text x="806.00" y="264" fill="#29222c" font-size="17" font-weight="600">57.2 MB</text><text x="710" y="322" fill="#aa245b" font-size="17" font-weight="600">82% less disk space</text><text x="40" y="354" fill="#776d77" font-size="13">Read the comparison for output differences, OCR costs, elapsed times, and measurement methods. Each panel uses its own scale.</text></g></svg>